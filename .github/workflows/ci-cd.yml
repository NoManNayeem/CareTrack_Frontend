name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # The standalone API repo used to spin up a real backend for end-to-end tests.
  BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY || format('{0}/CareTrack_Backend', github.repository_owner) }}

jobs:
  quality:
    name: Lint · Format · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          API_URL: http://localhost:4000

  e2e:
    name: End-to-end (Playwright · full Docker stack)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check out the API
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          path: backend
      - name: Start MongoDB + API, seed demo data
        working-directory: backend
        run: |
          docker compose up -d --build --wait
          docker compose --profile seed run --rm seed
      - name: Start web client
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=e2e
      - name: Container logs
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f backend/docker-compose.yml logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image → GHCR
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          build-args: |
            API_URL=http://api:4000
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Vercel (${{ github.event_name == 'pull_request' && 'preview' || 'production' }})
    needs: [quality, e2e]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check Vercel secrets
        id: guard
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets not configured — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build & deploy
        id: deploy
        if: steps.guard.outputs.enabled == 'true'
        run: |
          npm i -g vercel@latest
          FLAGS=()
          if [ "$TARGET" = "production" ]; then FLAGS+=(--prod); fi
          vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          vercel build "${FLAGS[@]}" --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt "${FLAGS[@]}" --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed ($TARGET): $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test deployment
        if: steps.guard.outputs.enabled == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 -o /dev/null "${{ steps.deploy.outputs.url }}/login"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}/api/v1/health"
      - name: Comment preview URL
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${{ steps.deploy.outputs.url }}`,
            });
