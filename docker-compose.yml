# CareTrack web client.
#
# Joins the network created by CareTrack_Backend's compose file, so start the API first:
#   (CareTrack_Backend)  docker compose up -d --build && docker compose --profile seed run --rm seed
#   (CareTrack_Frontend) docker compose up -d --build        → http://localhost:3000
name: caretrack-frontend

services:
  web:
    build:
      context: .
      target: runtime
      args:
        API_URL: ${API_URL:-http://api:4000}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    image: caretrack-frontend:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SESSION_COOKIE_NAME: ct_session
    networks: [caretrack]

networks:
  caretrack:
    name: caretrack-net
    external: true
